{k:'LOBI',t:'Selamat Datang',s:'Tujuan belajar & cara menjelajah',c:'#7a1f2b',p:'L',z:0,h:`<h2>Selamat Datang di Museum Penelitian Sosial</h2><p>Kamu akan menjelajahi 5 ruang pamer. Di ruang terakhir kamu menjadi <b>peneliti</b> yang menganalisis 4 kasus nyata (2 kuantitatif, 2 kualitatif) plus 1 kasus gabungan.</p><h3>Tujuan Belajar</h3><ol><li>Menjelaskan pengertian, ciri, dan fungsi penelitian sosial.</li><li>Menyusun langkah-langkah penelitian sosial.</li><li>Membedakan metode kuantitatif dan kualitatif.</li><li>Memilih teknik pengumpulan data yang tepat.</li><li>Menganalisis kasus dan menarik kesimpulan secara etis.</li></ol><div class="box"><b>Petunjuk:</b> klik panel emas untuk membaca. Panel yang sudah dibaca berubah hijau. Gunakan tombol ruang di bawah untuk berpindah cepat.</div>`},
{k:'LOBI',t:'Apa Itu Penelitian Sosial?',s:'Pengertian, ciri, dan fungsi',c:'#2e6f6a',p:'R',z:0,h:`<h2>Pengertian Penelitian Sosial</h2><p>Penelitian sosial adalah kegiatan <b>sistematis, terencana, dan objektif</b> untuk mengumpulkan serta menganalisis data tentang gejala atau masalah sosial agar dapat dipahami, dijelaskan, dan dicarikan solusinya.</p><h3>Ciri-ciri</h3><ul><li><b>Sistematis</b> – mengikuti tahapan yang runtut.</li><li><b>Empiris</b> – berdasarkan fakta lapangan, bukan opini.</li><li><b>Objektif</b> – bebas dari prasangka peneliti.</li><li><b>Logis & terverifikasi</b> – dapat diuji dan diulang orang lain.</li></ul><h3>Fungsi</h3><ul><li>Mendeskripsikan gejala sosial (apa yang terjadi).</li><li>Menjelaskan sebab-akibat (mengapa terjadi).</li><li>Memprediksi kecenderungan.</li><li>Memberi dasar kebijakan & pemecahan masalah.</li></ul><div class="box"><b>Contoh:</b> penelitian tentang pengaruh media sosial terhadap pergaulan remaja di sebuah sekolah.</div>`},
{k:'RUANG LANGKAH',t:'Langkah Penelitian Sosial',s:'Dari masalah hingga laporan',c:'#8a5a14',p:'L',z:-11,h:`<h2>Langkah-Langkah Penelitian Sosial</h2><ol><li><b>Menentukan topik & masalah</b> – dekat dengan kehidupan, layak diteliti.</li><li><b>Merumuskan masalah & tujuan</b> – berbentuk pertanyaan jelas.</li><li><b>Kajian pustaka</b> – membaca teori dan penelitian sebelumnya.</li><li><b>Hipotesis / pertanyaan penelitian</b> – jawaban sementara (kuantitatif) atau fokus kajian (kualitatif).</li><li><b>Menentukan metode & instrumen</b> – populasi/sampel atau informan, alat pengumpul data.</li><li><b>Mengumpulkan data</b> di lapangan.</li><li><b>Menganalisis data</b>.</li><li><b>Menarik kesimpulan & menyusun laporan</b>.</li></ol><div class="box">Contoh rumusan masalah: “Bagaimana pola interaksi siswa saat istirahat setelah penggunaan gawai meningkat?”</div>`},
{k:'RUANG LANGKAH',t:'Etika Penelitian',s:'Menghargai manusia yang diteliti',c:'#5b3a7a',p:'R',z:-11,h:`<h2>Etika Penelitian Sosial</h2><ul><li><b>Izin & informed consent</b> – responden tahu tujuan dan bersedia secara sukarela.</li><li><b>Kerahasiaan</b> – identitas disamarkan (inisial/nama samaran).</li><li><b>Tidak merugikan</b> – tidak mempermalukan atau membahayakan responden.</li><li><b>Kejujuran</b> – data tidak dimanipulasi.</li><li><b>Anti plagiarisme</b> – mencantumkan sumber.</li><li><b>Menghargai budaya</b> dan hak untuk berhenti kapan saja.</li></ul>`},
{k:'RUANG METODE',t:'Metode Kuantitatif',s:'Angka, sampel, dan statistik',c:'#1f4e8c',p:'L',z:-22,h:`<h2>Metode Penelitian Kuantitatif</h2><p>Meneliti gejala sosial yang dapat <b>diukur dengan angka</b>, lalu dianalisis statistik untuk melihat pola dan hubungan.</p><ul><li>Pola pikir <b>deduktif</b>: teori → hipotesis → pembuktian data.</li><li>Memakai <b>populasi dan sampel</b> yang mewakili.</li><li>Instrumen terstruktur: <b>kuesioner/angket</b>, tes, skala.</li><li>Hasil dapat <b>digeneralisasi</b> pada populasi.</li><li>Penyajian: tabel, persentase, rata-rata, grafik.</li></ul><div class="box"><b>Contoh:</b> survei 100 siswa tentang lama penggunaan gawai per hari dan hasilnya disajikan dalam persen.</div><p><b>Kelebihan:</b> luas, objektif, mudah dibandingkan. <b>Kekurangan:</b> kurang menggali alasan dan makna.</p>`},
{k:'RUANG METODE',t:'Metode Kualitatif',s:'Makna, konteks, dan pengalaman',c:'#a3422b',p:'R',z:-22,h:`<h2>Metode Penelitian Kualitatif</h2><p>Memahami <b>makna, pengalaman, dan proses</b> di balik perilaku sosial melalui data berupa kata, ucapan, dan perilaku.</p><ul><li>Pola pikir <b>induktif</b>: temuan lapangan → kesimpulan/teori.</li><li>Memakai <b>informan</b> yang dipilih sesuai kebutuhan (purposive).</li><li>Peneliti adalah <b>instrumen utama</b>.</li><li>Teknik: wawancara mendalam, observasi, dokumen.</li><li>Keabsahan data lewat <b>triangulasi</b> (membandingkan sumber/teknik).</li></ul><table><tr><th></th><th>Kuantitatif</th><th>Kualitatif</th></tr><tr><td>Data</td><td>Angka</td><td>Kata/deskripsi</td></tr><tr><td>Fokus</td><td>Seberapa banyak/luas</td><td>Mengapa & bagaimana</td></tr><tr><td>Subjek</td><td>Sampel besar</td><td>Informan terpilih</td></tr><tr><td>Hasil</td><td>Generalisasi</td><td>Pemahaman mendalam</td></tr></table>`},
{k:'RUANG DATA',t:'Teknik Pengumpulan Data',s:'Observasi, wawancara, kuesioner, dokumen',c:'#2f6b3a',p:'L',z:-33,h:`<h2>Teknik Pengumpulan Data</h2><table><tr><th>Teknik</th><th>Penjelasan</th></tr><tr><td><b>Observasi</b></td><td>Mengamati langsung perilaku di lapangan memakai catatan/lembar pengamatan.</td></tr><tr><td><b>Wawancara</b></td><td>Tanya jawab dengan informan; terstruktur atau mendalam.</td></tr><tr><td><b>Kuesioner (angket)</b></td><td>Daftar pertanyaan tertulis untuk banyak responden.</td></tr><tr><td><b>Studi dokumen/pustaka</b></td><td>Menelaah arsip, catatan, data statistik, laporan.</td></tr><tr><td><b>FGD</b></td><td>Diskusi kelompok terarah untuk menggali pendapat bersama.</td></tr></table><div class="box">Gunakan <b>lebih dari satu teknik</b> agar data saling menguatkan (triangulasi).</div>`},
{k:'RUANG DATA',t:'Analisis Data & Laporan',s:'Mengolah data menjadi kesimpulan',c:'#b0702a',p:'R',z:-33,h:`<h2>Analisis Data & Penyusunan Laporan</h2><h3>Data kuantitatif</h3><ol><li>Editing (memeriksa isian)</li><li>Tabulasi (merekap)</li><li>Hitung persentase/rata-rata</li><li>Sajikan tabel/grafik lalu tafsirkan</li></ol><h3>Data kualitatif</h3><ol><li><b>Reduksi</b> – memilih data penting</li><li><b>Penyajian</b> – narasi, kutipan, matriks</li><li><b>Penarikan kesimpulan</b> & verifikasi</li></ol><h3>Sistematika laporan</h3><p>Pendahuluan (latar, rumusan masalah, tujuan) → kajian pustaka → metode → hasil & pembahasan → kesimpulan & saran → daftar pustaka.</p>`},
